<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lapor Kendala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="px-8 py-6 bg-gray-900">
                <h2 class="text-2xl font-semibold">Admin Panel</h2>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="dashboard.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-tachometer-alt mr-3"></i> Dashboard</a>
                <a href="kelola-pengguna.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-users-cog mr-3"></i> Kelola Pengguna</a>
                <a href="jadwal-rapat.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-calendar-plus mr-3"></i> Jadwal Rapat</a>
                <a href="kalender-kegiatan.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-calendar-alt mr-3"></i> Kalender Kegiatan</a>
                <a href="kelola-pengumuman.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-bullhorn mr-3"></i> Kelola Pengumuman</a>
                <a href="lapor-kendala.html" class="flex items-center px-4 py-2 bg-gray-700 rounded-md"><i class="fas fa-exclamation-triangle mr-3"></i> Lapor Kendala</a>
                <a href="/logout" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md mt-auto"><i class="fas fa-sign-out-alt mr-3"></i> Logout</a>
            </nav>
        </div>
        <!-- Main content -->
        <div class="flex-1 p-10">
            <h1 class="text-3xl font-bold mb-6">Lapor Kendala Berkala ke Atasan</h1>
            
            <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8">
                <p class="text-gray-600 mb-6">Gunakan formulir ini untuk melaporkan kendala operasional atau teknis yang memerlukan perhatian dari manajemen tingkat atas.</p>
                <form id="form-kendala" class="space-y-6">
                    <div>
                        <label for="subjek_kendala" class="block text-sm font-medium text-gray-700">Subjek Kendala</label>
                        <input type="text" name="subjek_kendala" id="subjek_kendala" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-red-500 focus:border-red-500" placeholder="Contoh: Server database sering down" required>
                    </div>
                    <div>
                        <label for="kategori_kendala" class="block text-sm font-medium text-gray-700">Kategori</label>
                        <select id="kategori_kendala" name="kategori_kendala" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-red-500 focus:border-red-500">
                            <option>Teknis</option>
                            <option>Operasional</option>
                            <option>Sumber Daya Manusia</option>
                            <option>Fasilitas</option>
                            <option>Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label for="urgensi" class="block text-sm font-medium text-gray-700">Tingkat Urgensi</label>
                        <select id="urgensi" name="urgensi" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-red-500 focus:border-red-500">
                            <option value="rendah" class="text-green-600">Rendah</option>
                            <option value="sedang" class="text-yellow-600">Sedang</option>
                            <option value="tinggi" class="text-red-600">Tinggi</option>
                        </select>
                    </div>
                    <div>
                        <label for="deskripsi_kendala" class="block text-sm font-medium text-gray-700">Deskripsi Lengkap</label>
                        <textarea name="deskripsi_kendala" id="deskripsi_kendala" rows="5" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-red-500 focus:border-red-500" placeholder="Jelaskan kendala secara rinci, termasuk waktu kejadian dan dampak yang ditimbulkan." required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 font-medium">
                        <i class="fas fa-paper-plane mr-2"></i> Kirim Laporan ke Atasan
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
