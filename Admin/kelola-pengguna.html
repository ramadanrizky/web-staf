<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kelola Pengguna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="px-8 py-6 bg-gray-900">
                <h2 class="text-2xl font-semibold">Admin Panel</h2>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="dashboard.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-tachometer-alt mr-3"></i> Dashboard</a>
                <a href="kelola-pengguna.html" class="flex items-center px-4 py-2 bg-gray-700 rounded-md"><i class="fas fa-users-cog mr-3"></i> Kelola Pengguna</a>
                <a href="jadwal-rapat.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-calendar-plus mr-3"></i> Jadwal Rapat</a>
                <a href="kelola-pengumuman.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-bullhorn mr-3"></i> Kelola Pengumuman</a>
                <a href="kalender-kegiatan.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-calendar-alt mr-3"></i> Kalender Kegiatan</a>
                <a href="lapor-kendala.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-exclamation-triangle mr-3"></i> Lapor Kendala</a>
                <a href="/logout" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md mt-auto"><i class="fas fa-sign-out-alt mr-3"></i> Logout</a>
            </nav>
        </div>
        <!-- Main content -->
        <div class="flex-1 p-10">
            <h1 class="text-3xl font-bold mb-6">Kelola Pengguna</h1>
            
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <div class="px-6 py-4">
                    <h2 class="text-xl font-semibold text-gray-800">Daftar Pengguna Terdaftar</h2>
                    <p class="text-gray-600 mt-1">Berikut adalah semua pengguna yang ada di dalam database.</p>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama Lengkap</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Peran</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Data pengguna akan dimuat di sini oleh JavaScript -->
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin mr-2"></i> Memuat data pengguna...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal Edit Pengguna -->
        <div id="edit-user-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 hidden flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl w-11/12 md:w-1/3">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-gray-900">Edit Pengguna</h3>
                    <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form id="edit-user-form" class="p-6 space-y-4">
                    <input type="hidden" id="edit-user-id" name="user_id">
                    <div>
                        <label for="edit-fullname" class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                        <input type="text" id="edit-fullname" name="fullname" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3" required>
                    </div>
                    <div>
                        <label for="edit-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="edit-email" name="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-100" readonly>
                    </div>
                    <div>
                        <label for="edit-role" class="block text-sm font-medium text-gray-700">Peran</label>
                        <select id="edit-role" name="role" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3" required>
                            <option value="user">User</option>
                            <option value="atasan">Atasan</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label for="edit-superior" class="block text-sm font-medium text-gray-700">Atasan Langsung</label>
                        <select id="edit-superior" name="superior_id" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                            <option value="">-- Tidak Ada --</option>
                            <!-- Opsi atasan akan dimuat oleh JavaScript -->
                        </select>
                    </div>
                    <div id="edit-message-area" class="text-center text-sm"></div>
                    <div class="pt-2 text-right">
                        <button type="button" onclick="closeEditModal()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 mr-2">Batal</button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
    const modal = document.getElementById('edit-user-modal');
    const editForm = document.getElementById('edit-user-form');
    const editMessageArea = document.getElementById('edit-message-area');

    function openEditModal(userId, fullname, email, role, superiorId) {
        document.getElementById('edit-user-id').value = userId;
        document.getElementById('edit-fullname').value = fullname;
        document.getElementById('edit-email').value = email;
        document.getElementById('edit-role').value = role;
        document.getElementById('edit-superior').value = superiorId || '';
        modal.classList.remove('hidden');
    }

    function closeEditModal() {
        modal.classList.add('hidden');
        editMessageArea.innerHTML = '';
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const tableBody = document.getElementById('user-table-body');
        const superiorSelect = document.getElementById('edit-superior');

        // Fungsi untuk memuat atasan ke dalam dropdown
        async function loadSuperiors() {
            try {
                const response = await fetch('/api/superiors');
                const superiors = await response.json();
                superiors.forEach(s => {
                    superiorSelect.add(new Option(s.fullname, s.id));
                });
            } catch (error) {
                console.error('Gagal memuat daftar atasan:', error);
            }
        }

        async function loadUsers() {
            try{
                const response = await fetch('/api/users');
                if (!response.ok) {
                    throw new Error('Gagal mengambil data pengguna.');
                }
                const users = await response.json();

                tableBody.innerHTML = ''; // Kosongkan isi tabel

                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Tidak ada pengguna yang ditemukan.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const roleBadge = user.role === 'admin' ? `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">${user.role}</span>`
                                : user.role === 'atasan' ? `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">${user.role}</span>`
                                : `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">${user.role}</span>`;

                    const row = `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${user.fullname}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${user.email}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${roleBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <button onclick="openEditModal(${user.id}, '${user.fullname}', '${user.email}', '${user.role}', ${user.superior_id})" class="text-indigo-600 hover:text-indigo-900">Edit</button>
                                <button onclick="deleteUser(${user.id})" class="text-red-600 hover:text-red-900 ml-4">Hapus</button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
            } catch(error) {
                console.error('Error:', error);
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Gagal memuat data. Pastikan server backend berjalan.</td></tr>`;
            }
        }

        loadSuperiors();
        loadUsers();
    });

    async function deleteUser(userId) {
        if (!confirm('Apakah Anda yakin ingin menghapus pengguna ini? Tindakan ini tidak dapat dibatalkan.')) {
            return;
        }
        try {
            const response = await fetch(`/api/user/delete/${userId}`, { method: 'DELETE' });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error);
            }
            alert(result.message);
            location.reload(); // Muat ulang halaman untuk melihat perubahan
        } catch (error) {
            alert('Gagal menghapus pengguna: ' + error.message);
        }
    }

    editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = document.getElementById('edit-user-id').value;
        const formData = new FormData(editForm);

        editMessageArea.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;
        editMessageArea.className = 'text-center text-sm text-gray-600';

        try {
            const response = await fetch(`/api/user/update/${userId}`, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error);

            editMessageArea.innerHTML = result.message;
            editMessageArea.className = 'text-center text-sm text-green-600';
            setTimeout(() => location.reload(), 1500);
        } catch (error) {
            editMessageArea.innerHTML = error.message;
            editMessageArea.className = 'text-center text-sm text-red-600';
        }
    });
</script>
</body>
</html>
