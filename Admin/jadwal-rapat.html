<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Jadwal Rapat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="px-8 py-6 bg-gray-900">
                <h2 class="text-2xl font-semibold">Admin Panel</h2>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="dashboard.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-tachometer-alt mr-3"></i> Dashboard</a>
                <a href="kelola-pengguna.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-users-cog mr-3"></i> Kelola Pengguna</a>
                <a href="jadwal-rapat.html" class="flex items-center px-4 py-2 bg-gray-700 rounded-md"><i class="fas fa-calendar-plus mr-3"></i> Jadwal Rapat</a>
                <a href="kalender-kegiatan.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-calendar-alt mr-3"></i> Kalender Kegiatan</a>
                <a href="kelola-pengumuman.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-bullhorn mr-3"></i> Kelola Pengumuman</a>
                <a href="lapor-kendala.html" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md"><i class="fas fa-exclamation-triangle mr-3"></i> Lapor Kendala</a>
                <a href="/logout" class="flex items-center px-4 py-2 hover:bg-gray-700 rounded-md mt-auto"><i class="fas fa-sign-out-alt mr-3"></i> Logout</a>
            </nav>
        </div>
        <!-- Main content -->
        <div class="flex-1 p-10">
            <h1 class="text-3xl font-bold mb-6">Kelola Jadwal Rapat</h1>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Form Input Jadwal -->
                <div class="lg:col-span-1 bg-white shadow-md rounded-lg p-6 h-fit">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Tambah Rapat Baru</h3>
                    <form id="form-jadwal" class="space-y-4">
                        <div>
                            <label for="judul_rapat" class="block text-sm font-medium text-gray-700">Judul Rapat</label>
                            <input type="text" name="judul_rapat" id="judul_rapat" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                        </div>
                        <div>
                            <label for="tanggal_rapat" class="block text-sm font-medium text-gray-700">Tanggal</label>
                            <input type="date" name="tanggal_rapat" id="tanggal_rapat" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                        </div>
                        <div>
                            <label for="waktu_rapat" class="block text-sm font-medium text-gray-700">Waktu</label>
                            <input type="time" name="waktu_rapat" id="waktu_rapat" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                        </div>
                        <div>
                            <label for="peserta_rapat" class="block text-sm font-medium text-gray-700">Peserta</label>
                            <textarea name="peserta_rapat" id="peserta_rapat" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Contoh: Tim IT, Tim Marketing"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-medium">
                            <i class="fas fa-plus-circle mr-2"></i> Tambahkan Jadwal
                        </button>
                    </form>
                </div>

                <!-- Daftar Jadwal Rapat -->
                <div class="lg:col-span-2 bg-white shadow-md rounded-lg overflow-hidden">
                    <div class="px-6 py-4 border-b">
                        <h2 class="text-xl font-semibold text-gray-800">Daftar Rapat Terjadwal</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Judul</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tanggal & Waktu</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="jadwal-table-body" class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">
                                        <i class="fas fa-spinner fa-spin mr-2"></i> Memuat jadwal rapat...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const formJadwal = document.getElementById('form-jadwal');
    const tableBodyJadwal = document.getElementById('jadwal-table-body');

    async function loadMeetings() {
        try {
            const response = await fetch('/api/meetings');
            const meetings = await response.json();
            tableBodyJadwal.innerHTML = '';

            if (meetings.length === 0) {
                tableBodyJadwal.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Belum ada rapat yang dijadwalkan.</td></tr>';
                return;
            }

            meetings.forEach(meeting => {
                const row = `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${meeting.judul}</div>
                            <div class="text-sm text-gray-500">Peserta: ${meeting.peserta || '-'}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${meeting.tanggal}, ${meeting.waktu}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="deleteMeeting(${meeting.id})" class="text-red-600 hover:text-red-900">Hapus</button>
                        </td>
                    </tr>
                `;
                tableBodyJadwal.insertAdjacentHTML('beforeend', row);
            });
        } catch (error) {
            console.error('Error loading meetings:', error);
            tableBodyJadwal.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Gagal memuat data.</td></tr>';
        }
    }

    formJadwal.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(formJadwal);
        try {
            const response = await fetch('/api/meetings', { method: 'POST', body: formData });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error);
            alert(result.message);
            formJadwal.reset();
            loadMeetings();
        } catch (error) {
            alert('Gagal menambah jadwal: ' + error.message);
        }
    });

    async function deleteMeeting(meetingId) {
        if (!confirm('Apakah Anda yakin ingin menghapus jadwal rapat ini?')) return;
        try {
            const response = await fetch(`/api/meetings/${meetingId}`, { method: 'DELETE' });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error);
            alert(result.message);
            loadMeetings();
        } catch (error) {
            alert('Gagal menghapus jadwal: ' + error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadMeetings);
</script>
</body>
</html>
