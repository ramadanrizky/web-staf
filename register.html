<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karyawan - Registrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased h-screen flex">

    <!-- Bagian Kiri: Branding Perusahaan (Disembunyikan di layar kecil) -->
    <div class="hidden lg:flex lg:w-1/2 bg-blue-700 items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80')] bg-cover bg-center opacity-20"></div>
        <div class="relative z-10 p-12 text-center text-white">
            <h1 class="text-4xl font-bold mb-4">Aplikasi kantor harian</h1>
            <p class="text-lg text-blue-100 max-w-md mx-auto">Ruang kerja digital terintegrasi untuk kolaborasi tim dan manajemen yang lebih efisien.</p>
        </div>
    </div>

    <!-- Bagian Kanan: Form Registrasi -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12">
        <div class="w-full max-w-md">
            <!-- Logo Mobile -->
            <div class="text-center lg:hidden mb-8">
                <h1 class="text-3xl font-bold text-blue-700">Portal Karyawan</h1>
            </div>

            <h2 class="text-3xl font-bold text-gray-900 mb-2">BUAT AKUN BARU</h2>
            <p class="text-gray-500 mb-8">Isi data di bawah untuk mendaftar</p>

            <form id="register-form" class="space-y-6">
                
                <!-- Input Nama Lengkap -->
                <div>
                    <label for="fullname" class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" name="fullname" id="fullname" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-3 border" placeholder="Budi Santoso" required>
                    </div>
                </div>

                <!-- Input Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Alamat Email</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" name="email" id="email" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-3 border" placeholder="nama@gmail.com" required>
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" name="password" id="password" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-3 border" placeholder="••••••••" required>
                    </div>
                </div>
                
                <!-- Tombol Submit -->
                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                        Daftar
                    </button>
                </div>
            </form>

            <!-- Pesan Status -->
            <div id="error-message" class="hidden mt-4 text-center text-sm text-red-600 p-3 bg-red-100 rounded-md"></div>
            <div id="success-message" class="hidden mt-4 text-center text-sm text-green-600 p-3 bg-green-100 rounded-md"></div>

            <!-- Footer / Bantuan -->
            <div class="mt-8 text-center text-sm text-gray-500">
                <p>Sudah punya akun? <a href="/" class="text-blue-600 hover:underline">Masuk di sini</a>.</p>
            </div>
        </div>
    </div>
<script>
    const form = document.getElementById('register-form');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.add('hidden');
        successMessage.classList.add('hidden');

        const formData = new FormData(form);
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.innerHTML;
        submitButton.disabled = true;
        submitButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Mendaftar...`;

        try {
            const response = await fetch('/register', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                successMessage.textContent = result.message;
                successMessage.classList.remove('hidden');
                // Arahkan ke halaman login setelah 2 detik
                setTimeout(() => {
                    window.location.href = result.redirect_url;
                }, 2000);
            } else {
                errorMessage.textContent = result.error || 'Terjadi kesalahan.';
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.innerHTML = originalButtonText;
            }
        } catch (error) {
            errorMessage.textContent = 'Tidak dapat terhubung ke server.';
            errorMessage.classList.remove('hidden');
            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonText;
        }
    });
</script>
</body>
</html>
